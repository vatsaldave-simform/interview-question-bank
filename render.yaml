# The deployed bank: one free Render web service serving the API and the built client
# from one origin, against a free Neon Postgres. The reasoning is in
# docs/adr/0012-deploy-to-render-and-neon.md.

services:
  - type: web
    name: interview-question-bank
    runtime: docker
    plan: free
    # Pick the region closest to the people using it, and create the Neon project in
    # the matching one: every request pays the distance between them twice.
    region: singapore

    dockerfilePath: ./backend/Dockerfile
    # The workspace root, because the image builds the shared package and the client
    # alongside the API.
    dockerContext: .

    # No dockerCommand override: the image's own CMD is `node dist/index.js` and nothing
    # else. Migrations are applied by the deploy workflow before this service is asked
    # to restart, so a cold start — of which this tier has many — costs only the server
    # coming up.

    # Liveness, never readiness. Render uses this to decide whether to route traffic,
    # and this one service also serves the client: a check that asked /ready would take
    # the entire frontend off the air whenever the database blinked (ADR-0012).
    healthCheckPath: /health

    # Deploys come from the workflow, after the suite passes, so a push cannot reach
    # the shared URL without going through CI.
    autoDeploy: false

    # Only what differs from the defaults in backend/src/config/env.ts, which is where
    # a default is allowed to live. LOG_LEVEL, SHUTDOWN_TIMEOUT_MS and DATABASE_POOL_MAX
    # are all already what this environment wants, so restating them here would just be
    # a second place to remember to change.
    envVars:
      - key: NODE_ENV
        value: production
      # Neon's direct, unpooled connection string. `sync: false` keeps the value out of
      # git: Render prompts for it once and ignores this entry on every later sync, so
      # rotating it in the dashboard is not undone by a deploy.
      - key: DATABASE_URL
        sync: false
      # Signs access tokens. Render generates it once and keeps it: rotating it here
      # invalidates every token in flight, which is the point of it being short-lived.
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      # Render's load balancer is the one hop in front of this service. The rate limit
      # keys on the address this resolves to, so a wrong number here either shares one
      # allowance between every caller or lets a caller invent an address (ADR-0021).
      - key: TRUST_PROXY_HOPS
        value: 1
      # Brevo's SMTP relay on port 2525, because Render's free tier blocks outbound 25,
      # 465 and 587 (ADR-0037). The URL holds the SMTP key, so it stays out of git like
      # DATABASE_URL: smtp://<login>:<smtp key>@smtp-relay.brevo.com:2525
      - key: MAIL_URL
        sync: false
      # A sender Brevo has verified; it refuses any other.
      - key: MAIL_FROM
        sync: false
      # Where a mailed set-password link points: this service, which serves the client.
      - key: APP_URL
        value: https://interview-question-bank.onrender.com

    # PORT is set by Render itself, and the API reads it from the environment.
    # FRONTEND_DIR is set in the image, because it is a fact about the image's layout
    # rather than about this environment.
