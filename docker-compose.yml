name: interview-question-bank

# The API and the migration step address the same database; naming it once means they
# cannot drift apart.
x-database-url: &database-url
  postgresql://${POSTGRES_USER:-iqb}:${POSTGRES_PASSWORD:-iqb}@db:5432/${POSTGRES_DB:-iqb}

services:
  db:
    image: postgres:16-alpine
    # pg_stat_statements is the query-timing evidence this project relies on instead of
    # application instrumentation (ADR-0009). It has to be preloaded at server start.
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iqb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iqb}
      POSTGRES_DB: ${POSTGRES_DB:-iqb}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iqb} -d ${POSTGRES_DB:-iqb}"]
      interval: 2s
      timeout: 3s
      retries: 15

  # The database the suite truncates. A separate service with storage in memory, so it
  # is fast, disposable, and cannot reach development data however wrong a URL goes.
  db-test:
    image: postgres:16-alpine
    command: ["postgres", "-c", "fsync=off", "-c", "full_page_writes=off"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iqb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iqb}
      POSTGRES_DB: ${POSTGRES_DB:-iqb}_test
    ports:
      - "${DB_TEST_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iqb} -d ${POSTGRES_DB:-iqb}_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Migrations run here rather than in the API's own start-up, which is what lets the
  # API image ship no Prisma CLI at all (ADR-0012). `docker compose up` still needs no
  # manual step: this service runs to completion first and the API waits for it.
  #
  # Built from the API image's `builder` stage, which already holds the CLI, the schema
  # and the migrations. Those layers are the same ones the api build produces, so this
  # is a tag over the existing build cache rather than a second build.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: builder
    working_dir: /app/backend
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy
    # One shot. A failed migration should stop the deployment, not retry behind it.
    restart: "no"

  # Creates the Viewers, because there is no registration endpoint (ADR-0016): without
  # this a fresh `docker compose up` has a running bank that nobody can log in to. It
  # runs in the builder stage for the same reason `migrate` does — that is where the
  # TypeScript and its runner still are — and is idempotent, leaving an existing Viewer
  # untouched. The deployment does not run it; seeding Neon is a local command (README).
  seed:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: builder
    working_dir: /app/backend
    command: ["./node_modules/.bin/tsx", "src/commands/seed.ts"]
    environment:
      DATABASE_URL: *database-url
      # Read only because the seed validates the whole environment on the way in.
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-local-development-access-token-secret}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}
      DATABASE_URL: *database-url
      # Local only. The deployment generates its own and never reads this file.
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-local-development-access-token-secret}
      ACCESS_TOKEN_LIFETIME_SECONDS: ${ACCESS_TOKEN_LIFETIME_SECONDS:-900}
      LOGIN_RATE_LIMIT_MAX_ATTEMPTS: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:-20}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-900}
      # Compose publishes the port straight to the host: no proxy, so no hops to trust.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      # So the schema is already in place when the first request arrives, and a failed
      # migration keeps the API from starting against a database it does not match.
      migrate:
        condition: service_completed_successfully
      # So the credentials in the README work the moment the API answers.
      seed:
        condition: service_completed_successfully
    # Long enough for in-flight requests to finish before compose stops waiting.
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
