name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      db-test:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: iqb
          POSTGRES_PASSWORD: iqb
          POSTGRES_DB: iqb_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U iqb -d iqb_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      DATABASE_URL: postgresql://iqb:iqb@localhost:5433/iqb_test
      LOG_LEVEL: silent

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm build

      # Against a real PostgreSQL, from a clean checkout, with no manual setup.
      - run: pnpm test
